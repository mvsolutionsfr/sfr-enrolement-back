livenessProbe:
  path: "/alive.html"
  scheme: "HTTP"
  probeType: "httpGet"
  conf:
    initialDelaySeconds: 60
    timeoutSeconds: 15
    periodSeconds: 15
    failureThreshold: 5
    successThreshold: 1

readinessProbe:
  path: "/alive.html"
  scheme: "HTTP"
  probeType: "httpGet"
  conf:
    initialDelaySeconds: 10
    timeoutSeconds: 3
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1250Mi
  requests:
    cpu: 200m
    memory: 500Mi